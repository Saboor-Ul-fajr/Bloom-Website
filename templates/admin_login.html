<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom - Admin Sign In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <form class="auth-card" id="admin-login-form">
      <div class="auth-brand">
        <span class="brand-icon">🌸</span>
        <h1>Bloom Admin</h1>
        <p>Authorized staff access</p>
      </div>
      <div class="field">
        <label for="admin-username">Admin username</label>
        <input id="admin-username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="admin-password">Password</label>
        <input id="admin-password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn-auth" type="submit">Sign in</button>
      <div class="auth-error" id="admin-login-error"></div>
    </form>
  </div>
  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const response = await fetch('/admin/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('admin-username').value.trim(),
          password: document.getElementById('admin-password').value
        })
      });
      const result = await response.json();
      if (result.ok) window.location.href = result.redirect;
      else document.getElementById('admin-login-error').textContent = result.error;
    });
  </script>
</body>
</html>
